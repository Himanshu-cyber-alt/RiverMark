name: Deploy Rivermark Backend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rivermark-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

   
      - name: Get ECR repository URL
        run: |
          ECR_URL=$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].repositoryUri' \
            --output text)

          echo "ECR_URL=$ECR_URL" >> "$GITHUB_ENV"

          echo "ECR repository: $ECR_URL"

      
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "$AWS_REGION" | \
          docker login \
            --username AWS \
            --password-stdin "$ECR_URL"

     
      - name: Build backend image
        run: |
          docker build \
            -t "$ECR_URL:${GITHUB_SHA}" \
            ./backend

     
      - name: Push backend image
        run: |
          docker push "$ECR_URL:${GITHUB_SHA}"

     
      - name: Find active backend
        run: |

          ALLOCATION_ID=$(aws ec2 describe-addresses \
            --filters Name=tag:Name,Values=rivermark-backend-eip \
            --query 'Addresses[0].AllocationId' \
            --output text)

          ACTIVE_INSTANCE=$(aws ec2 describe-addresses \
            --allocation-ids "$ALLOCATION_ID" \
            --query 'Addresses[0].InstanceId' \
            --output text)

          echo "ALLOCATION_ID=$ALLOCATION_ID" >> "$GITHUB_ENV"
          echo "ACTIVE_INSTANCE=$ACTIVE_INSTANCE" >> "$GITHUB_ENV"

          echo "Active EC2: $ACTIVE_INSTANCE"

     
      - name: Find inactive backend
        run: |

          BLUE_ID=$(aws ec2 describe-instances \
            --filters \
              Name=tag:Name,Values=rivermark-backend-blue \
              Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          GREEN_ID=$(aws ec2 describe-instances \
            --filters \
              Name=tag:Name,Values=rivermark-backend-green \
              Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "$ACTIVE_INSTANCE" = "$BLUE_ID" ]; then
            TARGET_INSTANCE="$GREEN_ID"
            TARGET_NAME="GREEN"
          else
            TARGET_INSTANCE="$BLUE_ID"
            TARGET_NAME="BLUE"
          fi

          echo "BLUE_ID=$BLUE_ID"
          echo "GREEN_ID=$GREEN_ID"
          echo "TARGET_INSTANCE=$TARGET_INSTANCE"
          echo "TARGET_NAME=$TARGET_NAME"

          echo "TARGET_INSTANCE=$TARGET_INSTANCE" >> "$GITHUB_ENV"
          echo "TARGET_NAME=$TARGET_NAME" >> "$GITHUB_ENV"

      
      - name: Get RDS endpoint
        run: |

          DB_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier rivermark-postgres \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)

          echo "DB_ENDPOINT=$DB_ENDPOINT" >> "$GITHUB_ENV"

          echo "RDS endpoint: $DB_ENDPOINT"

     
      - name: Deploy to inactive EC2 using SSM
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$TARGET_INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "echo '\''Logging into ECR...'\''",
              "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$ECR_URL"'",
              "echo '\''Pulling image...'\''",
              "docker pull '"$ECR_URL:${GITHUB_SHA}"'",
              "echo '\''Removing previous container...'\''",
              "docker rm -f rivermark-backend 2>/dev/null || true",
              "echo '\''Getting DB password from SSM...'\''",
              "DB_PASSWORD=$(aws ssm get-parameter --name /rivermark/db/password --with-decryption --query Parameter.Value --output text --region '"$AWS_REGION"')",
              "echo '\''Starting backend...'\''",
              "docker run -d --name rivermark-backend --restart unless-stopped -p 5000:5000 -e PORT=5000 -e SERVER_NAME='"$TARGET_NAME"' -e DB_HOST='"$DB_ENDPOINT"' -e DB_PORT=5432 -e DB_NAME=rivermark -e DB_USER=rivermark_admin -e DB_PASSWORD=\"$DB_PASSWORD\" '"$ECR_URL:${GITHUB_SHA}"'",
              "echo '\''Deployment command completed.'\''"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

          echo "SSM Command ID: $COMMAND_ID"

    
      - name: Wait for deployment
        run: |

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE" \
              --query 'Status' \
              --output text)

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Deployment failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$TARGET_INSTANCE"

              exit 1
            fi

            sleep 5

          done

          echo "Deployment timed out."
          exit 1


      - name: Health check new backend
        run: |

          echo "Checking new backend"

          for i in {1..12}; do

            HEALTH_COMMAND=$(aws ssm send-command \
              --instance-ids "$TARGET_INSTANCE" \
              --document-name "AWS-RunShellScript" \
              --parameters commands='["curl -f http://localhost:5000/health"]' \
              --query 'Command.CommandId' \
              --output text)

            sleep 3

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$HEALTH_COMMAND" \
              --instance-id "$TARGET_INSTANCE" \
              --query 'Status' \
              --output text)

            echo "Health check status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "New backend is healthy."
              exit 0
            fi

            sleep 5

          done

          echo "New backend failed health check."
          echo "EIP will NOT be switched."

          exit 1

      
      - name: Switch traffic to new backend
        run: |

          echo "Switching EIP..."

          aws ec2 associate-address \
            --allocation-id "$ALLOCATION_ID" \
            --instance-id "$TARGET_INSTANCE" \
            --allow-reassociation

          echo "Traffic switched successfully."

      # Deployment successful
      - name: Deployment successful
        run: |

          echo "======================================"
          echo "Rivermark deployment successful"
          echo "======================================"

          echo "Docker image:"
          echo "$ECR_URL:${GITHUB_SHA}"

          echo "Active EC2:"
          echo "$TARGET_INSTANCE"

          echo "Active server:"
          echo "$TARGET_NAME"

          echo "======================================"